# TrafficAI - Nginx Secure Server Configuration
# Location: /etc/nginx/sites-available/traffic_ai

# 1. HTTP - Redirect all traffic to HTTPS (Security Best Practice)
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your Domain Name or Server IP Address

    # Redirect to HTTPS securely
    return 301 https://$host$request_uri;
}

# 2. HTTPS - Secure SSL/TLS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # Replace with your Domain Name or Server IP Address

    # SSL Certificates (Provisioned via Let's Encrypt or Self-Signed)
    ssl_certificate /etc/nginx/ssl/traffic_ai.crt;
    ssl_certificate_key /etc/nginx/ssl/traffic_ai.key;

    # SSL Protocol Hardening (Disable insecure SSLv3, TLSv1, TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Secure Ciphers (Modern Profile)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max body size for CCTV/Surveillance image uploads
    client_max_body_size 25M;

    # 3. Serve React/Vite Frontend Static Files
    location / {
        root /var/www/traffic-ai/frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Enable gzip compression for better performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;
    }

    # 4. Reverse Proxy for Java Backend Service (Port 5000)
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Keep headers aligned
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Client IP propagation
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer YOLOv8 image processing queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Optional: Log configurations
    access_log /var/log/nginx/traffic_ai_access.log;
    error_log /var/log/nginx/traffic_ai_error.log;
}
