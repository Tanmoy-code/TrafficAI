name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # Clone repository code
    - name: Checkout repository
      run: |
        git clone https://github.com/Tanmoy-code/TrafficAI.git .
        git checkout ${{ github.sha }}

    # Install Java 21
    - name: Install JDK 21
      run: |
        sudo apt update
        sudo apt install -y openjdk-21-jdk

        echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> $GITHUB_PATH

    # Verify Java installation
    - name: Check Java version
      run: |
        java -version
        mvn -version

    # Build Maven project
    - name: Build with Maven
      run: |
        cd backend
        mvn -B package

    # Optional dependency check replacement
    - name: Generate dependency list
      run: |
        cd backend
        mvn dependency:tree
